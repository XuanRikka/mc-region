[package]
name = "mc-region"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = { version = "1.1.9", default-features = false }
zstd = { version = "0.13.3", optional = true, default-features = false, features = ["arrays", "legacy", "fat-lto"] }
lz4-java-wrc = { version = "0.2.0", optional = true }
byteorder = "1.5.0"
thiserror = "2.0"
memmap2 = "0.9.12"
zerocopy = { version = "0.8.63", features = ["derive"] }

[features]
default = ["zlib-rs", "lz4", "zstd"]

zlib-rs = ["flate2/zlib-rs"]
miniz-oxide = ["flate2/miniz_oxide"]
zlib = ["flate2/zlib"]
zlib-ng = ["flate2/zlib-ng"]

lz4 = ["dep:lz4-java-wrc"]

zstd = ["dep:zstd"]

[[example]]
name = "test"

